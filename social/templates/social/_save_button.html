<div class="save-block">
    {% if not is_my_series %}
        {% if already_saved %}
            <p>✅ Квиз уже сохранен</p>
            <form method="post" action="{% url 'social:unsave_series' series_id=series.pk %}"
                hx-post="{% url 'social:unsave_series' series_id=series.pk %}"
                hx-target="closest .save-block"
                hx-swap="outerHTML"
                hx-disabled-elt="find button">
              {% csrf_token %}
              <button class="btn" type="submit">Убрать</button>
            </form>
        {% else %}
            <form method="post" action="{% url 'social:save_series' series_id=series.pk %}"
                hx-post="{% url 'social:save_series' series_id=series.pk %}"
                hx-target="closest .save-block"
                hx-swap="outerHTML"
                hx-disabled-elt="find button">
              {% csrf_token %}
              <button class="btn" type="submit">Сохранить к себе</button>
            </form>
        {% endif %}
    {% endif %}
</div>
