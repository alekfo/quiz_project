<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        {% block title %}
            Base title
        {% endblock %}
    </title>
</head>
<body>
    {% if user.is_authenticated %}
        <div>
            <a href="{% url 'quizzes:menu' %}">QUIZ_PROJECT</a>
        </div>
        <form method="post" action="{% url 'users:logout' %}">
          {% csrf_token %}
          <button type="submit">Выйти</button>
        </form>
        <div>
            {{ user.username }}
        </div>
    {% else %}
        <a href="{% url 'users:login' %}">Войти</a>
        <a href="{% url 'users:register' %}">Регистрация</a>
    {% endif %}
    {% block body %}
        Base body
    {% endblock %}
</body>
</html>
