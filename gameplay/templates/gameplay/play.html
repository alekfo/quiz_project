{% extends 'gameplay/base.html' %}

{% block title %}
    INDEX PLAY
{% endblock %}

{% block body %}
    <p>Вопрос № {{ current_question.order }}:</p>
    <div>
        {{ current_question.text }}
    </div>
    <form method="post">
        {%  csrf_token %}
        {% for option in current_question.options.all %}
            <div>
<!--                за счет того, что у всех options будет один name, html сам организует чтобы был из них выюран только один-->
                <input type="radio" name="chosen_option_id" value="{{ option.pk }}" id="option_{{ option.pk }}">
                <label for="option_{{ option.pk }}">
                    {{ option.text }}
                </label>
            </div>
        {% endfor %}
        <div>
            <input type="hidden" name="current_answer_id" value="{{ current_answer.pk }}">
            <button type="submit">ОТВЕТИТЬ</button>
        </div>
    </form>
    <div id="timer">
        Оставшееся время {{remaining_seconds}}
    </div>
    <script>
        // стартовое значение посчитано на сервере (views.py::play) через
        // time_limit_seconds - elapsed, отдано сюда уже готовым целым числом -
        // клиенту не нужно сверяться с часами сервера, только отсчитывать вниз
        let remaining = {{ remaining_seconds }};
        const timerEl = document.getElementById('timer');

        // setInterval не крутит цикл сам - он просит браузер вызывать эту функцию
        // заново каждые 1000 мс (1000 миллисекунд = 1 секунда, задержка у
        // setInterval/setTimeout всегда в мс), пока не вызовется clearInterval
        const interval = setInterval(() => {
            // каждое отдельное срабатывание - это один вызов колбэка:
            // -1 к remaining и обновление текста на странице
            remaining -= 1;
            timerEl.textContent = remaining;
            if (remaining <= 0) {
              // останавливаем именно этот таймер по его id (interval),
              // иначе браузер продолжит дёргать колбэк и после 0
              clearInterval(interval);
            }
        }, 1000);
    </script>

{% endblock %}
