<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        {% block title %}
            Base title
        {% endblock %}
    </title>
</head>
<body>
    {% if messages %}
        <ul class="messages">
          {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
          {% endfor %}
        </ul>
    {% endif %}
    <div>
        <a href="{% url 'quizzes:menu' %}">QUIZ_PROJECT</a>
    </div>
    <form method="post" action="{% url 'users:logout' %}">
      {% csrf_token %}
      <button type="submit">Выйти</button>
    </form>
    <div>
        {{ user.username }}
    </div>
    {% block body %}
        Base body
    {% endblock %}
</body>
</html>
